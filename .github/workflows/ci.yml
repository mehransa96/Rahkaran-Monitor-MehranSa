name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  linux:
    name: Build + safety/unit/arch tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build (warnings as errors, WPF compiled via EnableWindowsTargeting)
        run: dotnet build RSM.sln -c Release
      - name: Test
        run: dotnet test RSM.sln -c Release --no-build --logger "console;verbosity=minimal"
      - name: Analyzer canary (Process.Start in a collector must fail the build)
        run: ./build/analyzer-canary.sh

  integration:
    name: Read-only proof (SQL Server 2022 + Redis, least-privilege login)
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ format('Ci-{0}-Sa1!', github.run_id) }}
        ports: ["1433:1433"]
      redis:
        image: redis:7
        ports: ["6379:6379"]
      rabbitmq:
        image: rabbitmq:3.13-management
        ports: ["15672:15672"]
    env:
      SA_PASSWORD: ${{ format('Ci-{0}-Sa1!', github.run_id) }}
      RSM_IT_PASSWORD: ${{ format('Ci-{0}-Rsm1!', github.run_id) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 60); do
            docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA_PASSWORD" -Q "SELECT 1" >/dev/null 2>&1 && exit 0
            sleep 2
          done
          exit 1
      - name: Create least-privilege login (as the DBA would, per PERMISSIONS.md)
        run: |
          docker cp tests/integration/setup-rsm-monitor.sql ${{ job.services.mssql.id }}:/tmp/setup.sql
          docker exec -e RSM_IT_PASSWORD="$RSM_IT_PASSWORD" ${{ job.services.mssql.id }} \
            /opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U sa -P "$SA_PASSWORD" -i /tmp/setup.sql
      - name: Seed known deviations (plays a misconfigured customer server)
        run: |
          docker cp tests/integration/seed-deviations.sql ${{ job.services.mssql.id }}:/tmp/seed.sql
          docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U sa -P "$SA_PASSWORD" -i /tmp/seed.sql
      - name: Fingerprint the server before RSM connects
        run: |
          docker cp tests/integration/fingerprint.sql ${{ job.services.mssql.id }}:/tmp/fingerprint.sql
          docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U sa -P "$SA_PASSWORD" -h -1 -W -i /tmp/fingerprint.sql > fingerprint-before.txt
          wc -l fingerprint-before.txt
      - name: Integration tests (least-privilege login)
        env:
          RSM_IT_SQL: Server=localhost,1433;User ID=rsm_monitor;Password=${{ env.RSM_IT_PASSWORD }};TrustServerCertificate=True;Encrypt=Optional
          RSM_IT_REDIS: 127.0.0.1:6379
          # RabbitMQ management API (guest is allowed from localhost only — the mapped port is local).
          RSM_IT_RABBIT: http://127.0.0.1:15672/
          RSM_IT_SEEDED: "1"
          # Admin connection used only by the test's demo "application" (blocking/deadlock, always rolled back).
          RSM_IT_SQL_ADMIN: Server=localhost,1433;User ID=sa;Password=${{ env.SA_PASSWORD }};TrustServerCertificate=True;Encrypt=Optional
        run: dotnet test tests/RSM.Integration.Tests -c Release --logger "console;verbosity=detailed"
      - name: Read-only proof — server fingerprint unchanged
        run: |
          docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U sa -P "$SA_PASSWORD" -h -1 -W -i /tmp/fingerprint.sql > fingerprint-after.txt
          diff -u fingerprint-before.txt fingerprint-after.txt && echo "read-only proof: no server state changed"

  windows:
    name: Build, test, publish single-file exe (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build RSM.sln -c Release
      - run: dotnet test RSM.sln -c Release --no-build --logger "console;verbosity=minimal"
      - name: Publish self-contained single-file win-x64
        run: dotnet publish src/RSM.App/RSM.App.csproj -c Release -r win-x64 -o publish
      - name: Smoke test (exe exists, size sane)
        shell: pwsh
        run: |
          $exe = Get-Item publish/RSM.exe
          if ($exe.Length -lt 50MB) { throw "RSM.exe unexpectedly small: $($exe.Length)" }
          Write-Host "RSM.exe $([math]::Round($exe.Length / 1MB)) MB"
      # The published exe really starts on Windows Server: it walks every page in fa and en, saves PNGs (the user
      # guide's screenshots) and prints a test page to PDF with WebView2, then exits. No site, no connection.
      - name: Run the published exe (UI tour + PDF smoke)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath publish/RSM.exe -ArgumentList '--portable','--ui-snapshots' -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); throw "RSM.exe did not finish the UI tour in 4 minutes" }
          if ($p.ExitCode -ne 0) { throw "RSM.exe exited with $($p.ExitCode)" }
          $shots = Get-ChildItem publish/data/ui-snapshots -Filter *.png
          Write-Host "$($shots.Count) screenshots"
          if ($shots.Count -lt 40) { throw "expected a screenshot of every page in fa and en" }
          $pdf = Get-Content publish/data/ui-snapshots/pdf-smoke.txt -Raw
          Write-Host "PDF smoke: $pdf"
          if (-not $pdf.StartsWith('ok')) { throw "WebView2 PDF export failed: $pdf" }
          Get-Content publish/data/logs/*.log -ErrorAction SilentlyContinue | Select-String -Pattern 'Error|Fatal' | Select-Object -First 20
      - name: Publish and run RSM.Cli (single-file)
        shell: pwsh
        run: |
          dotnet publish src/RSM.Cli/RSM.Cli.csproj -c Release -r win-x64 -o publish-cli
          ./publish-cli/RSM.Cli.exe --help
          if ($LASTEXITCODE -ne 0) { throw "RSM.Cli --help failed" }
          ./publish-cli/RSM.Cli.exe --portable --list
          if ($LASTEXITCODE -ne 0) { throw "RSM.Cli --list failed" }
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ui-snapshots
          path: publish/data/ui-snapshots/
          retention-days: 14
      # Convenience download only: publish + smoke test above are the real check. The account's artifact storage
      # quota can be exhausted by earlier 150 MB uploads, which must not turn the build red.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: RSM-win-x64
          path: publish/
          retention-days: 3

  iis:
    name: IIS live requests, logs, services, events and .NET counters (Windows, read-only proof)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # CI setup plays the customer server: it installs IIS and a slow test page. RSM itself never changes IIS.
      - name: Install IIS with Request Monitor and ASP.NET 4.x
        shell: powershell
        run: |
          Install-WindowsFeature Web-Server, Web-Request-Monitor, Web-Asp-Net45, Web-Http-Logging | Out-Null
          Get-WindowsFeature Web-Request-Monitor, Web-Asp-Net45 | Format-Table Name, InstallState
      - name: Create AuxWebsite1 (port 8081, pool RsmItPool) with a page that sleeps 40 s
        shell: powershell
        run: |
          Import-Module WebAdministration
          New-Item -ItemType Directory -Force C:\rsmit\site | Out-Null
          Set-Content -Path C:\rsmit\site\slow.aspx -Value '<%@ Page Language="C#" %><% System.Threading.Thread.Sleep(40000); %>done'
          Set-Content -Path C:\rsmit\site\index.html -Value 'ok'
          New-WebAppPool -Name RsmItPool | Out-Null
          New-Website -Name AuxWebsite1 -Port 8081 -PhysicalPath C:\rsmit\site -ApplicationPool RsmItPool | Out-Null
          Invoke-WebRequest http://localhost:8081/index.html -UseBasicParsing | Select-Object StatusCode
      - name: Install the ASP.NET Core Hosting Bundle (ANCM)
        shell: powershell
        run: |
          Invoke-WebRequest https://aka.ms/dotnet/8.0/dotnet-hosting-win.exe -OutFile $env:RUNNER_TEMP\hosting.exe -UseBasicParsing
          Start-Process $env:RUNNER_TEMP\hosting.exe -ArgumentList '/install','/quiet','/norestart' -Wait
          net stop was /y
          net start w3svc
      - name: Host the CI ASP.NET Core app in-process (8082, CoreInPool) and out-of-process (8083, CoreOutPool)
        shell: powershell
        run: |
          Import-Module WebAdministration
          dotnet publish tests/integration/RsmItCoreApp -c Release -o C:\rsmit\core-in
          Copy-Item C:\rsmit\core-in C:\rsmit\core-out -Recurse
          $cfg = 'C:\rsmit\core-out\web.config'
          (Get-Content $cfg) -replace 'hostingModel="inprocess"', 'hostingModel="outofprocess"' | Set-Content $cfg
          Select-String -Path $cfg -Pattern 'hostingModel'
          foreach ($p in 'CoreInPool', 'CoreOutPool') { New-WebAppPool -Name $p | Out-Null; Set-ItemProperty IIS:\AppPools\$p -Name managedRuntimeVersion -Value '' }
          New-Website -Name CoreIn -Port 8082 -PhysicalPath C:\rsmit\core-in -ApplicationPool CoreInPool | Out-Null
          New-Website -Name CoreOut -Port 8083 -PhysicalPath C:\rsmit\core-out -ApplicationPool CoreOutPool | Out-Null
          Invoke-WebRequest http://localhost:8082/ -UseBasicParsing | Select-Object StatusCode
          Invoke-WebRequest http://localhost:8083/ -UseBasicParsing | Select-Object StatusCode
          Get-CimInstance Win32_Process -Filter "Name = 'w3wp.exe' OR Name = 'dotnet.exe'" | Format-Table ProcessId, ParentProcessId, Name
      - name: Fingerprint IIS configuration before RSM connects
        shell: powershell
        run: |
          (Get-FileHash $env:windir\System32\inetsrv\config\applicationHost.config).Hash | Out-File iis-before.txt
          foreach ($p in 'RsmItPool', 'CoreInPool', 'CoreOutPool') { Get-WebAppPoolState -Name $p | Out-File -Append iis-before.txt }
          Get-Content iis-before.txt
      - name: IIS and .NET runtime integration tests (elevated, local)
        env:
          RSM_IT_IIS: "1"
          RSM_IT_DOTNET: "1"
        run: dotnet test tests/RSM.Integration.Tests -c Release --filter "FullyQualifiedName~IisLiveTests|FullyQualifiedName~DotNetRuntimeLiveTests" --logger "console;verbosity=detailed"
      - name: Read-only proof — IIS configuration and pool state unchanged
        shell: powershell
        run: |
          (Get-FileHash $env:windir\System32\inetsrv\config\applicationHost.config).Hash | Out-File iis-after.txt
          foreach ($p in 'RsmItPool', 'CoreInPool', 'CoreOutPool') { Get-WebAppPoolState -Name $p | Out-File -Append iis-after.txt }
          if (Compare-Object (Get-Content iis-before.txt) (Get-Content iis-after.txt)) { throw "IIS state changed" }
          Write-Host "read-only proof: applicationHost.config and pool state unchanged"
