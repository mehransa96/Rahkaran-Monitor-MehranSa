name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  linux:
    name: Build + safety/unit/arch tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build (warnings as errors, WPF compiled via EnableWindowsTargeting)
        run: dotnet build RSM.sln -c Release
      - name: Test
        run: dotnet test RSM.sln -c Release --no-build --logger "console;verbosity=minimal"
      - name: Analyzer canary (Process.Start in a collector must fail the build)
        run: ./build/analyzer-canary.sh

  integration:
    name: Read-only proof (SQL Server 2022 + Redis, least-privilege login)
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ format('Ci-{0}-Sa1!', github.run_id) }}
        ports: ["1433:1433"]
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      SA_PASSWORD: ${{ format('Ci-{0}-Sa1!', github.run_id) }}
      RSM_IT_PASSWORD: ${{ format('Ci-{0}-Rsm1!', github.run_id) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 60); do
            docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA_PASSWORD" -Q "SELECT 1" >/dev/null 2>&1 && exit 0
            sleep 2
          done
          exit 1
      - name: Create least-privilege login (as the DBA would, per PERMISSIONS.md)
        run: |
          docker cp tests/integration/setup-rsm-monitor.sql ${{ job.services.mssql.id }}:/tmp/setup.sql
          docker exec -e RSM_IT_PASSWORD="$RSM_IT_PASSWORD" ${{ job.services.mssql.id }} \
            /opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U sa -P "$SA_PASSWORD" -i /tmp/setup.sql
      - name: Seed known deviations (plays a misconfigured customer server)
        run: |
          docker cp tests/integration/seed-deviations.sql ${{ job.services.mssql.id }}:/tmp/seed.sql
          docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U sa -P "$SA_PASSWORD" -i /tmp/seed.sql
      - name: Fingerprint the server before RSM connects
        run: |
          docker cp tests/integration/fingerprint.sql ${{ job.services.mssql.id }}:/tmp/fingerprint.sql
          docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U sa -P "$SA_PASSWORD" -h -1 -W -i /tmp/fingerprint.sql > fingerprint-before.txt
          wc -l fingerprint-before.txt
      - name: Integration tests (least-privilege login)
        env:
          RSM_IT_SQL: Server=localhost,1433;User ID=rsm_monitor;Password=${{ env.RSM_IT_PASSWORD }};TrustServerCertificate=True;Encrypt=Optional
          RSM_IT_REDIS: 127.0.0.1:6379
          RSM_IT_SEEDED: "1"
          # Admin connection used only by the test's demo "application" (blocking/deadlock, always rolled back).
          RSM_IT_SQL_ADMIN: Server=localhost,1433;User ID=sa;Password=${{ env.SA_PASSWORD }};TrustServerCertificate=True;Encrypt=Optional
        run: dotnet test tests/RSM.Integration.Tests -c Release --logger "console;verbosity=detailed"
      - name: Read-only proof — server fingerprint unchanged
        run: |
          docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U sa -P "$SA_PASSWORD" -h -1 -W -i /tmp/fingerprint.sql > fingerprint-after.txt
          diff -u fingerprint-before.txt fingerprint-after.txt && echo "read-only proof: no server state changed"

  windows:
    name: Build, test, publish single-file exe (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build RSM.sln -c Release
      - run: dotnet test RSM.sln -c Release --no-build --logger "console;verbosity=minimal"
      - name: Publish self-contained single-file win-x64
        run: dotnet publish src/RSM.App/RSM.App.csproj -c Release -r win-x64 -o publish
      - name: Smoke test (exe exists, size sane)
        shell: pwsh
        run: |
          $exe = Get-Item publish/RSM.exe
          if ($exe.Length -lt 50MB) { throw "RSM.exe unexpectedly small: $($exe.Length)" }
          Write-Host "RSM.exe $([math]::Round($exe.Length / 1MB)) MB"
      # Convenience download only: publish + smoke test above are the real check. The account's artifact storage
      # quota can be exhausted by earlier 150 MB uploads, which must not turn the build red.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: RSM-win-x64
          path: publish/
          retention-days: 3
